
# ── GENERAL ──────────────────────────────────────
general {
    hide_cursor = true
    grace = 1
    ignore_empty_input = true
}

# ── BACKGROUND ───────────────────────────────────
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.02
    contrast = 0.9
    brightness = 0.7
    vibrancy = 0.15
}

# ── HOUR ─────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] date +"%H"
    color = rgb(cdd6f4)
    font_size = 120
    font_family = JetBrainsMono Nerd Font
    position = 0, 100
    halign = center
    valign = center
}

# ── MINUTES ──────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] date +"%M"
    color = rgb(89b4fa)
    font_size = 120
    font_family = JetBrainsMono Nerd Font
    position = 0, -30
    halign = center
    valign = center
}

# ── DATE ─────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] date +"%A  •  %d %B %Y"
    color = rgb(a6adc8)
    font_size = 14
    font_family = Inter
    position = 0, -120
    halign = center
    valign = center
}

# ── PASSWORD FIELD ───────────────────────────────
input-field {
    monitor =
    size = 300, 52

    outline_thickness = 1
    rounding = 14

    outer_color = rgb(585b70)
    inner_color = rgba(24, 24, 37, 0.85)

    font_color = rgb(cdd6f4)
    check_color = rgb(a6e3a1)
    fail_color = rgb(f38ba8)

    dots_size = 0.25
    dots_spacing = 0.3

    # Escape # as ## so the config parser preserves the markup color.
    placeholder_text = <span foreground="##a6adc8">  $USER</span>
    fade_on_empty = false

    shadow_pass = 0

    position = 0, -220
    halign = center
    valign = center
}
