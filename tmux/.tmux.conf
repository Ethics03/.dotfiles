# Catppuccin Mocha with a restrained blue accent.

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"

# Use Ctrl+Space as tmux's prefix instead of Ctrl+B.
set -g prefix C-Space
unbind-key C-b
bind-key C-Space send-prefix

set -g mouse on
set -g history-limit 10000
set -g escape-time 10

# Number windows and panes from 1; close gaps after windows are removed.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Copy mouse and keyboard selections to the Wayland clipboard.
set -s copy-command 'wl-copy'
bind-key -T copy-mode Enter send-keys -X copy-pipe-and-cancel

# New windows and splits inherit the active pane's directory.
bind-key c new-window -c '#{pane_current_path}'
bind-key % split-window -h -c '#{pane_current_path}'
bind-key '"' split-window -v -c '#{pane_current_path}'

# Compact status bar at the top.
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 32
set -g status-right-length 40
set -g status-left "#[fg=#89b4fa,bold] #S #[fg=#6c7086]│"
set -g status-right "#[fg=#6c7086]│ #[fg=#cdd6f4]%a %d %b  #[fg=#89b4fa,bold]%H:%M "

set -g window-status-format " #[fg=#a6adc8]#I #W "
set -g window-status-current-format " #[fg=#1e1e2e,bg=#89b4fa,bold]#I #W "
set -g window-status-separator ""
set -g window-status-style "bg=#1e1e2e,fg=#a6adc8"
set -g window-status-current-style "bg=#89b4fa,fg=#1e1e2e,bold"

# Subtle pane borders; blue marks the active pane.
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Match prompts, copy mode, popups, and tmux menus to the same palette.
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"
set -g mode-style "bg=#89b4fa,fg=#1e1e2e,bold"
set -g popup-style "bg=#1e1e2e,fg=#cdd6f4"
set -g popup-border-style "fg=#45475a"
set -g menu-style "bg=#1e1e2e,fg=#cdd6f4"
set -g menu-selected-style "bg=#89b4fa,fg=#1e1e2e,bold"
set -g menu-border-style "fg=#45475a"

# Prefix + m opens a small command menu.
bind-key m display-menu -T " tmux " -x C -y C \
  "New window" n { new-window -c '#{pane_current_path}' } \
  "Horizontal split" h { split-window -h -c '#{pane_current_path}' } \
  "Vertical split" v { split-window -v -c '#{pane_current_path}' } \
  "Choose window" w { choose-tree -Zw } \
  "Reload config" r { source-file ~/.tmux.conf \; display-message "Config reloaded" } \
  "Detach" d { detach-client }

bind-key r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Native right-click menus that stay open after mouse release.
source-file ~/.config/tmux/mouse.conf
